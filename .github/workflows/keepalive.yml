# GitHub zet geplande workflows in een openbare repo uit na 60 dagen zonder
# activiteit. Deze workflow zet maandelijks de datum in tools/keepalive.txt en
# commit die. Een commit met GITHUB_TOKEN start geen andere workflows, dus dit
# geeft geen extra publicatie.

name: Planning actief houden

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  datum:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Datum bijwerken en committen
        run: |
          date -u +%Y-%m-%d > tools/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/keepalive.txt
          git diff --cached --quiet && exit 0
          git commit -m "Planning actief houden"
          git push
